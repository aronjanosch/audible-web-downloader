services:
  audible-web-downloader:
    image: ${AUDIBLE_IMAGE:-ghcr.io/aronjanosch/audible-web-downloader:latest}
    container_name: audible-web-downloader
    user: "1000:1000"
    ports:
      - "5505:5505"
    volumes:
      # Mount config directory to persist all configuration files and auth tokens
      - ./config:/app/config
      # Mount temporary downloads directory for AAX files, vouchers, and conversion work
      - ./downloads:/app/downloads
      # Mount library directory for final organized M4B audiobooks
      - ./library:/app/library
      - ./library_data:/app/library_data
    environment:
      - TZ=Europe/Berlin
      - HOME=/tmp
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY in your environment or .env before starting}
      - FLASK_ENV=${FLASK_ENV:-production}
      - ABS_URL=${ABS_URL:-}
      - ABS_API_TOKEN=${ABS_API_TOKEN:-}
      - ABS_LIBRARY_ID=${ABS_LIBRARY_ID:-}
    restart: unless-stopped
