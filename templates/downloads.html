{% extends "base.html" %}

{% block title %}Downloads — Audible Downloader{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/downloads.css') }}">
{% endblock %}

{% block content %}
<div class="page-head">
    <h1 class="page-title">Downloads</h1>
    <div class="actions">
        <button type="button" class="chip-btn strong" id="pauseAllBtn" data-queue-pause aria-pressed="false">Pause all</button>
        <button type="button" class="chip-btn strong" id="clearFinishedBtn">Clear finished</button>
    </div>
</div>

<section class="dl-stats" aria-label="Queue summary">
    <div class="dl-stat"><div class="dl-stat-label">ACTIVE</div><div class="dl-stat-value" id="statActive">0</div></div>
    <div class="dl-stat"><div class="dl-stat-label">SPEED</div><div class="dl-stat-value" id="statSpeed">–</div></div>
    <div class="dl-stat"><div class="dl-stat-label">TIME LEFT</div><div class="dl-stat-value" id="statEta">–</div></div>
    <div class="dl-stat"><div class="dl-stat-label">TODAY</div><div class="dl-stat-value" id="statToday">0 books</div></div>
</section>

<section class="dl-list" id="downloadList" aria-live="polite">
    <div class="downloads-empty">Nothing in the queue. Pick books in the library to start downloading.</div>
</section>
{% endblock %}
