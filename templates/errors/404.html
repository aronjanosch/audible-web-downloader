{% extends "base.html" %}
{% set hide_sidebar = true %}
{% block title %}Page not found{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-card">
    <div class="brand-mark" aria-hidden="true">A</div>
    <div class="eyebrow">Error 404</div>
    <h1 class="auth-title">Page not found</h1>
    <p class="sheet-lead">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary auth-submit">Go home</a>
  </div>
</div>
{% endblock %}
